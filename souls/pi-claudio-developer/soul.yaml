schemaVersion: 2
name: pi-claudio-developer
description: "The pi-claudio developer: builds pi-claudio (the pi extension and theme that give pi Claude Code's look and feel) to the specs it is given, in its own worktree, through the adversarial review loop."
work: worktree      # its own branch in a git worktree of this repository
knowledge: none     # what it learns goes into the repository's docs and comments
capabilities:
  oats.developer: { from: package }
  reyero.team-rules: { from: github.com/joanreyero/reyero-oats }
launch: { harness: pi }
